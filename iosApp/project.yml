# XcodeGen spec. Nya.xcodeproj is generated from this and never committed.
name: Nya
options:
  bundleIdPrefix: com.nya
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Nya:
    type: application
    platform: iOS
    sources:
      - Nya
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nya.app
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Nya
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
schemes:
  Nya:
    build:
      targets:
        Nya: all
