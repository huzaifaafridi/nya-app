name: iOS build

on:
  push:
    paths:
      - "iosApp/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "iosApp/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: Build for the iOS simulator
        working-directory: iosApp
        run: |
          xcodebuild build \
            -project Nya.xcodeproj \
            -scheme Nya \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build for real iPhones (unsigned)
        working-directory: iosApp
        run: |
          xcodebuild build \
            -project Nya.xcodeproj \
            -scheme Nya \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package unsigned .ipa
        working-directory: iosApp/build
        run: |
          mkdir Payload
          cp -R Build/Products/Release-iphoneos/Nya.app Payload/
          lipo -archs Payload/Nya.app/Nya | grep -q arm64
          test "$(plutil -extract CFBundleSupportedPlatforms.0 raw Payload/Nya.app/Info.plist)" = iPhoneOS
          zip -qry Nya.ipa Payload
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Nya-ipa
          path: iosApp/build/Nya.ipa
          if-no-files-found: error
      - name: Run unit tests and walk through onboarding in the simulator
        working-directory: iosApp
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          for runtime in json.load(sys.stdin)['devices'].values():
              for d in runtime:
                  if d['name'].startswith('iPhone'):
                      print(d['udid']); sys.exit()
          ")
          xcrun simctl boot "$UDID"
          xcrun simctl ui "$UDID" appearance dark
          xcodebuild test \
            -project Nya.xcodeproj \
            -scheme Nya \
            -destination "id=$UDID" \
            -resultBundlePath build/onboarding.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Collect screenshots
        if: always()
        working-directory: iosApp/build
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path onboarding.xcresult --output-path screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nya-screenshots
          path: iosApp/build/screenshots
